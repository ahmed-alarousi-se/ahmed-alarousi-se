<svg fill="none" viewBox="0 0 800 220" width="800" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Subtitle -->
  <text x="400" y="45" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="3">
    Software &amp; AI Systems Engineer
  </text>

  <!-- Banner Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="720" height="120" rx="16" fill="url(#boxGrad)" />
    <!-- Subtle curved bottom wave -->
    <path d="M 40 150 Q 400 200 760 150 L 760 174 Q 760 190 744 190 L 56 190 Q 40 190 40 174 Z" fill="#034d7a" opacity="0.4" />
  </g>

  <!-- Main Title -->
  <text x="400" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    AHMED AL-AROUSI
  </text>
</svg>
